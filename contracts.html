<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عقود تسليم السيارات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tailwind.js"></script>
  <script src="js/db.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-16">
  <div class="p-4 sm:p-6 lg:p-8 w-full max-w-full space-y-8 mt-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-4xl font-bold text-indigo-600">عقود تسليم السيارات</h1>
        <p class="text-gray-500 mt-2">تعيين السائقين على المركبات وتوليد سندات التسليم</p>
      </div>
      <a href="drivers.html" class="bg-slate-800 text-white px-6 py-3 rounded-xl hover:bg-slate-700 shadow-lg">
        العودة
      </a>
    </div>

    <!-- Actions / Add Button -->
    <div class="flex justify-between items-center mb-6" id="contracts-actions">
      <button onclick="processGlobalRecurringBilling()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold shadow transition-all flex items-center gap-2">
        ⚡ تشغيل وتحديث أتمتة الاستحقاق الأسبوعي
      </button>
      <button id="show-form-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 font-bold">إنشاء عقد جديد</button>
    </div>

    <!-- Add Form (hidden by default) -->
    <div id="add-contract-form" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8 hidden">
      <h2 class="text-2xl font-bold text-slate-800 mb-6">إنشاء عقد جديد (تسليم مركبة)</h2>
      <form id="contract-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 mb-2 font-bold">اختر السائق</label>
            <select id="driver_id" required class="w-full border p-3 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="">-- اختر السائق --</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700 mb-2 font-bold">اختر المركبة</label>
            <select id="car_id" required class="w-full border p-3 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="">-- اختر المركبة --</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700 mb-2 font-bold">تاريخ الاستلام / العقد</label>
            <input type="date" id="start_date" required class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-gray-700 mb-2 font-bold">المطلوب أسبوعياً (ريال)</label>
            <input type="number" step="0.01" id="weekly_required" placeholder="مثال: 1500" required class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-gray-700 mb-2 font-bold">المطلوب إجمالياً (ريال)</label>
            <input type="number" step="0.01" id="total_required" placeholder="إجمالي قيمة العقد" required class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
        <div class="flex gap-4 mt-6">
          <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">اعتماد العقد وإنشاء السند</button>
          <button type="button" id="cancel-form-btn" class="bg-gray-200 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-300">إلغاء</button>
        </div>
      </form>
    </div>

    <!-- Contracts List -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-2xl font-bold text-slate-800 mb-6">العقود الحالية</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-right">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="p-4 rounded-tr-lg">السائق</th>
              <th class="p-4">المركبة (اللوحة)</th>
              <th class="p-4">تاريخ الاستلام</th>
              <th class="p-4">المطلوب أسبوعياً</th>
              <th class="p-4">الدورة والتكرار الدوري</th>
              <th class="p-4 rounded-tl-lg">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="contracts-table-body">
            <tr><td colSpan="6" class="text-center p-4 text-gray-500">جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_DRIVERS = "/api/drivers";
    const API_CARS = "/api/cars";
    const API_CONTRACTS = "/api/contracts";

    const showFormBtn = document.getElementById("show-form-btn");
    const cancelFormBtn = document.getElementById("cancel-form-btn");
    const addContractForm = document.getElementById("add-contract-form");
    const contractForm = document.getElementById("contract-form");
    const tableBody = document.getElementById("contracts-table-body");

    const driverSelect = document.getElementById("driver_id");
    const carSelect = document.getElementById("car_id");

    // Set default contract date
    document.getElementById("start_date").value = new Date().toISOString().split("T")[0];

    showFormBtn.addEventListener("click", () => {
      addContractForm.classList.remove("hidden");
      showFormBtn.classList.add("hidden");
    });

    cancelFormBtn.addEventListener("click", () => {
      addContractForm.classList.add("hidden");
      showFormBtn.classList.remove("hidden");
      contractForm.reset();
      document.getElementById("start_date").value = new Date().toISOString().split("T")[0];
    });

    async function processGlobalRecurringBilling() {
      try {
        const res = await fetch("/api/recurring-billing/process", { method: "POST" });
        const data = await res.json();
        alert(data.message || "تم تشغيل الأتمتة بنجاح");
        loadData();
      } catch (err) {
        console.error("Error processing recurring billing:", err);
      }
    }

    async function rolloverContract(id) {
      if (confirm("هل أنت متأكد من ترحيل الدورة الأسبوعية وفتح الأسبوع التالي لهذا العقد؟")) {
        try {
          const res = await fetch(`/api/contracts/${id}/rollover`, { method: "POST" });
          const data = await res.json();
          if (res.ok) {
            alert(data.message || "تم الترحيل بنجاح");
            loadData();
          } else {
            alert("فشل الترحيل: " + (data.error || "خطأ غير معروف"));
          }
        } catch (err) {
          console.error("Error in contract rollover:", err);
        }
      }
    }

    async function loadData() {
      try {
        // Load Drivers
        const driversRes = await fetch(API_DRIVERS);
        const drivers = await driversRes.json();
        driverSelect.innerHTML = `<option value="">-- اختر السائق --</option>` +
          drivers.map(d => `<option value="${d.id}">${d.name} (${d.national_id})</option>`).join('');

        // Load Cars
        const carsRes = await fetch(API_CARS);
        const cars = await carsRes.json();
        carSelect.innerHTML = `<option value="">-- اختر المركبة --</option>` +
          cars.map(c => `<option value="${c.id}">${c.plate_number} - ${c.company} ${c.model}</option>`).join('');

        // Load Contracts
        const contractsRes = await fetch(API_CONTRACTS);
        const contracts = await contractsRes.json();

        if (contracts.length === 0) {
          tableBody.innerHTML = `<tr><td colSpan="6" class="text-center p-4 text-gray-500">لا توجد عقود مسجلة بعد</td></tr>`;
          return;
        }

        tableBody.innerHTML = contracts.map(c => {
          const startDate = new Date(c.start_date + 'T00:00:00');
          const today = new Date();
          startDate.setHours(0,0,0,0);
          today.setHours(0,0,0,0);
          let weeksPassed = 0;
          if (today >= startDate) {
            weeksPassed = Math.floor(Math.abs(today - startDate) / (1000 * 60 * 60 * 24 * 7));
          }
          const weekNum = Math.max(1, weeksPassed + 1, parseInt(c.rollover_count || 0) + 1);

          return `
          <tr class="border-b border-slate-50 hover:bg-slate-50">
            <td class="p-4 font-bold">${c.driver_name}</td>
            <td class="p-4 text-blue-600 font-bold">${c.plate_number}</td>
            <td class="p-4">${c.start_date}</td>
            <td class="p-4 text-green-600 font-bold">${c.weekly_required} ريال</td>
            <td class="p-4">
              <div class="flex items-center gap-2">
                <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">تكرار أسبوعي تلقائي</span>
                <span class="text-xs text-slate-500 font-bold">الأسبوع ${weekNum}</span>
              </div>
            </td>
            <td class="p-4">
              <a href="driver-details.html?id=${c.driver_id}" class="text-indigo-600 font-bold hover:underline mx-2">كشف الحساب</a>
              <button onclick="rolloverContract(${c.id})" class="text-emerald-600 font-bold hover:underline mx-2">ترحيل الأسبوع</button>
              <button onclick="deleteContract(${c.id})" class="text-red-500 hover:underline mx-2">حذف</button>
            </td>
          </tr>
        `;
        }).join('');
      } catch (error) {
        console.error("Error loading data:", error);
        tableBody.innerHTML = `<tr><td colSpan="6" class="text-center p-4 text-red-500">حدث خطأ أثناء تحميل البيانات</td></tr>`;
      }
    }

    async function deleteContract(id) {
      if (confirm("هل أنت متأكد من حذف هذا العقد؟")) {
        try {
          const res = await fetch(`${API_CONTRACTS}/${id}`, { method: "DELETE" });
          if (res.ok) {
            loadData();
          } else {
            alert("فشل الحذف");
          }
        } catch (error) {
          console.error("Error deleting contract:", error);
          alert("حدث خطأ أثناء الاتصال بالخادم");
        }
      }
    }

    contractForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        driver_id: parseInt(driverSelect.value),
        car_id: parseInt(carSelect.value),
        start_date: document.getElementById("start_date").value,
        weekly_required: parseFloat(document.getElementById("weekly_required").value),
        total_required: parseFloat(document.getElementById("total_required").value)
      };

      try {
        const response = await fetch(API_CONTRACTS, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          alert("تم توقيع العقد وإنشاء سند تسليم المركبة التلقائي بنجاح!");
          addContractForm.classList.add("hidden");
          showFormBtn.classList.remove("hidden");
          contractForm.reset();
          document.getElementById("start_date").value = new Date().toISOString().split("T")[0];
          loadData();
        } else {
          const err = await response.json();
          alert("فشل الحفظ: " + (err.error || "خطأ غير معروف"));
        }
      } catch (error) {
        console.error("Error creating contract:", error);
        alert("حدث خطأ أثناء الاتصال بالخادم");
      }
    });

    // Initial Load
    loadData();
  </script>
</body>
</html>
