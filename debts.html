<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المديونيات والذمم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tailwind.js"></script>
  <script src="js/db.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-16">
  <div class="p-8 max-w-6xl mx-auto space-y-8 mt-10">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-4xl font-bold text-red-500">المديونيات والذمم</h1>
        <p class="text-gray-500 mt-2">كشف السائقين المطالبين بسداد المديونيات</p>
      </div>
      <a href="index.html" class="bg-slate-800 text-white px-6 py-3 rounded-xl hover:bg-slate-700 shadow-lg">
        العودة للرئيسية
      </a>
    </div>

    <!-- Debts List -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-2xl font-bold text-slate-800 mb-6">قائمة المديونيات</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-right">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="p-4 rounded-tr-lg">السائق</th>
              <th class="p-4">حالة العقد</th>
              <th class="p-4 text-orange-600">المديونية المتراكمة للتشغيل</th>
              <th class="p-4 text-red-600">إجمالي الذمم (رصيد مدين)</th>
              <th class="p-4 rounded-tl-lg">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="debts-table-body">
            <tr><td colSpan="5" class="text-center p-4 text-gray-500">جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "/api/debts";
    const tableBody = document.getElementById("debts-table-body");

    async function loadDebts() {
      try {
        const response = await fetch(API_URL);
        const debts = await response.json();

        if (debts.length === 0) {
          tableBody.innerHTML = `<tr><td colSpan="5" class="text-center p-4 text-green-500 font-bold">لا يوجد سائقين بمديونيات حالياً</td></tr>`;
          return;
        }

        tableBody.innerHTML = debts.map(d => `
          <tr class="border-b border-slate-50 hover:bg-slate-50">
            <td class="p-4 font-bold">${d.driver_name}</td>
            <td class="p-4">
              ${d.active_contract ? '<span class="text-green-600 font-bold">نشط</span>' : '<span class="text-gray-400">بدون عقد نشط</span>'}
            </td>
            <td class="p-4 font-bold text-orange-600">${d.accumulated_debt > 0 ? d.accumulated_debt + ' ريال' : '0 ريال'}</td>
            <td class="p-4 font-bold text-red-600">${d.net_balance > 0 ? d.net_balance + ' ريال' : '0 ريال'}</td>
            <td class="p-4">
              <a href="driver-details.html?id=${d.driver_id}" class="text-sky-600 hover:underline mx-2 bg-sky-50 px-3 py-1 rounded">كشف الحساب وسداد</a>
            </td>
          </tr>
        `).join('');
      } catch (error) {
        console.error("Error loading debts:", error);
        tableBody.innerHTML = `<tr><td colSpan="5" class="text-center p-4 text-red-500">حدث خطأ أثناء تحميل البيانات</td></tr>`;
      }
    }

    // Initial Load
    loadDebts();
  </script>
</body>
</html>
