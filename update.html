<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحديث النظام - أجرة ويندوز الإصدار 1.3.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans">
  <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-md w-full border border-slate-100 relative overflow-hidden">
    <div class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-3 py-1 rounded-full font-bold mb-4">
      🚀 الإصدار 1.3.0 (وقوف السيارات + حركة الصندوق + تعديل السائقين)
    </div>
    
    <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 animate-spin">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </div>
    
    <h1 class="text-2xl font-black text-slate-800 mb-2">جاري تحديث النظام إلى v1.3.0...</h1>
    <p class="text-slate-500 mb-6 text-sm">جاري تنظيف الذاكرة المؤقتة وإلغاء الكاش القديم وتطبيق التمدد الشامل للواجهات.</p>
    
    <div class="w-full bg-slate-100 rounded-full h-3 mb-3 overflow-hidden p-0.5 border border-slate-200">
      <div class="bg-gradient-to-r from-emerald-500 to-teal-600 h-2 rounded-full transition-all duration-700 ease-out w-0" id="progress-bar"></div>
    </div>
    
    <p id="status-text" class="text-xs text-emerald-600 font-bold">بدء التحديث وتحديث ملفات التخزين المحلي...</p>
  </div>

  <script>
    async function forceUpdate() {
      const progressBar = document.getElementById('progress-bar');
      const statusText = document.getElementById('status-text');
      
      setTimeout(async () => {
        progressBar.style.width = '35%';
        statusText.textContent = "جاري مسح وتسجيل Service Worker v7 جديد...";
        
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
              await registration.unregister();
            }
          }
          
          progressBar.style.width = '70%';
          statusText.textContent = "جاري حرق ومسح كامل ملفات الكاش القديمة...";
          
          if (window.caches) {
            const keys = await caches.keys();
            for (let key of keys) {
              await caches.delete(key);
            }
          }
        } catch (e) {
          console.error("Error clearing caches:", e);
        }
        
        progressBar.style.width = '100%';
        statusText.textContent = "تم التحديث بنجاح! جاري تحويلك للرئيسية...";
        
        // Force reload from server bypassing cache
        setTimeout(() => {
          window.location.replace('index.html?v=1.3.0&t=' + new Date().getTime());
        }, 800);
        
      }, 400);
    }
    
    // Start automatically
    forceUpdate();
  </script>
</body>
</html>
