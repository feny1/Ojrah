<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طباعة السند</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
  <script src="js/db.js"></script>
  <style>
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      body { background: white !important; }
      .no-print { display: none !important; }
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Arial', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <!-- Go Back Button (Hidden during printing) -->
  <div class="no-print" style="padding: 16px; direction: rtl;">
    <a href="vouchers.html" style="background: #1e293b; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-family: Cairo; font-weight: 700; display: inline-block;">
      ← العودة للسندات
    </a>
  </div>

  <div id="voucher-container">
    <div style="padding: 40px; text-align: center; font-family: Cairo;">جاري التحميل...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const voucherId = urlParams.get("id");

    if (!voucherId) {
      document.getElementById("voucher-container").innerHTML = `<div style="padding: 40px; text-align: center; color: red;">لم يتم تحديد السند!</div>`;
    } else {
      loadVoucher();
    }

    async function loadVoucher() {
      try {
        const response = await fetch(`/api/vouchers/${voucherId}`);
        const v = await response.json();
        
        const container = document.getElementById("voucher-container");

        if (v.voucher_type === "سند تسليم مركبة") {
          container.innerHTML = getHandoverHtml(v);
        } else {
          container.innerHTML = getFinancialHtml(v);
        }

        // Auto print trigger
        setTimeout(() => window.print(), 700);

      } catch (err) {
        console.error("Error loading voucher print:", err);
        document.getElementById("voucher-container").innerHTML = `<div style="padding: 40px; text-align: center; color: red;">حدث خطأ أثناء تحميل السند</div>`;
      }
    }

    function getFinancialHtml(v) {
      const isReceipt = v.voucher_type === "سند قبض";
      const title = isReceipt ? "سنـد قبـض" : "سنـد صـرف";
      const verb = isReceipt ? "استلمنا من السيد/ة" : "صرفنا للسيد/ة";
      const amount = v.amount ?? (isReceipt ? (v.credit || v.debit) : v.debit) ?? 0;
      
      let payMethod = v.payment_method || (v.category === "network" ? "شبكة" : "كاش");
      if (isReceipt && ((v.cash_amount || 0) > 0 && (v.network_amount || 0) > 0)) {
        payMethod = `كاش: ${v.cash_amount} ، شبكة: ${v.network_amount}`;
      } else if (isReceipt && (v.cash_amount || 0) > 0) {
        payMethod = "كاش";
      } else if (isReceipt && (v.network_amount || 0) > 0) {
        payMethod = "شبكة";
      }
      
      const vNum = v.voucher_number || `V-${v.id}`;
      const date = v.voucher_date || v.date || "";
      const name = v.driver_name || "________________________________";

      return `
        <div dir="rtl" style="width: 210mm; min-height: 297mm; margin: 0 auto; padding: 16mm 14mm; background: white; color: #000; font-size: 14px; line-height: 1.9;">
          <div style="border: 3px solid #000; padding: 14px 18px; min-height: 255mm; display: flex; flex-direction: column;">
            <div style="border: 1px solid #000; padding: 10px 14px; flex: 1; display: flex; flex-direction: column;">
              
              <!-- Header -->
              <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 14px;">
                <div>
                  <div style="font-size: 18px; font-weight: 900;">مؤسسة أجرة لتقنية المعلومات</div>
                  <div style="font-size: 11px; color: #444; mt-3">إدارة أسطول المركبات — المملكة العربية السعودية</div>
                </div>
                <div style="border: 2px solid #000; padding: 5px 18px; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: 2px;">${title}</div>
              </div>

              <!-- Meta -->
              <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 13px;">
                <div><b>رقم السند:</b> <span style="border-bottom: 1px solid #000; padding-bottom: 2px; min-width: 90px; display: inline-block; text-align: center; font-weight: 700;">${vNum}</span></div>
                <div><b>طريقة الدفع:</b> <span style="border-bottom: 1px solid #000; padding-bottom: 2px; min-width: 90px; display: inline-block; text-align: center; font-weight: 700;">${payMethod}</span></div>
                <div><b>التاريخ:</b> <span style="border-bottom: 1px solid #000; padding-bottom: 2px; min-width: 90px; display: inline-block; text-align: center; font-weight: 700;">${date}</span></div>
              </div>

              <!-- Content -->
              <div style="border: 1px solid #000; padding: 16px 20px; margin-bottom: 20px;">
                <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; font-size: 15px;">
                  <span style="font-weight: 700; white-space: nowrap; min-width: 190px;">${verb}:</span>
                  <span style="border-bottom: 1px solid #000; flex: 1; font-weight: 700; padding-bottom: 2px; text-align: center; font-size: 17px;">${name}</span>
                </div>
                <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; font-size: 15px;">
                  <span style="font-weight: 700; white-space: nowrap; min-width: 190px;">مبلغاً وقدره بالأرقام:</span>
                  <span style="border-bottom: 1px solid #000; flex: 1; font-weight: 700; padding-bottom: 2px; text-align: center; font-size: 17px;">${amount} ريال سعودي</span>
                </div>
                <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; font-size: 15px;">
                  <span style="font-weight: 700; white-space: nowrap; min-width: 190px;">المبلغ بالحروف:</span>
                  <span style="border-bottom: 1px solid #000; flex: 1; font-weight: 400; padding-bottom: 2px; text-align: center; color: #333;">_________________________________________________ ريالاً سعودياً لا غير</span>
                </div>
                <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; font-size: 15px;">
                  <span style="font-weight: 700; white-space: nowrap; min-width: 190px;">وذلك بموجب / عن:</span>
                  <span style="border-bottom: 1px solid #000; flex: 1; font-weight: 700; padding-bottom: 2px; text-align: center;">${v.description || "________________________"}</span>
                </div>
                ${v.plate_number ? `
                  <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; font-size: 15px;">
                    <span style="font-weight: 700; white-space: nowrap; min-width: 190px;">رقم لوحة المركبة:</span>
                    <span style="border-bottom: 1px solid #000; flex: 1; font-weight: 700; padding-bottom: 2px; text-align: center;">${v.plate_number}</span>
                  </div>
                ` : ''}
                <div style="margin-top: 16px; border: 2px solid #000; padding: 9px 18px; display: flex; justify-content: space-between; align-items: center;">
                  <span style="font-weight: 900; font-size: 15px;">إجمالي المبلغ</span>
                  <span style="font-weight: 900; font-size: 20px; letter-spacing: 1px;">${amount} ر.س</span>
                </div>
              </div>

              <!-- Signatures -->
              <div style="display: flex; justify-content: space-between; gap: 16px; margin-top: auto; padding-top: 20px;">
                <div style="flex: 1; text-align: center;">
                  <div style="font-weight: 700; font-size: 13px;">المستلم / الدافع</div>
                  <div style="border-bottom: 1px solid #000; margin-top: 48px; margin-bottom: 4px;"></div>
                  <div style="font-size: 11px; color: #666;">التوقيع والختم</div>
                </div>
                <div style="flex: 1; text-align: center;">
                  <div style="font-weight: 700; font-size: 13px;">المحاسب / مدير المؤسسة</div>
                  <div style="border-bottom: 1px solid #000; margin-top: 48px; margin-bottom: 4px;"></div>
                  <div style="font-size: 11px; color: #666;">التوقيع والختم</div>
                </div>
              </div>

              <!-- Footer -->
              <div style="border-top: 1px solid #ccc; margin-top: 20px; padding-top: 8px; display: flex; justify-content: space-between; font-size: 11px; color: #666;">
                <span>هذه الوثيقة صادرة إلكترونياً ومعتمدة من المؤسسة</span>
                <span>رقم الوثيقة: ${vNum} | أجرة © ${new Date().getFullYear()}</span>
              </div>

            </div>
          </div>
        </div>
      `;
    }

    function getHandoverHtml(v) {
      const contract = v.contract || {};
      const vNum = v.voucher_number || `V-${v.id}`;
      const date = v.voucher_date || v.date || "";

      function getFR(lbl, val) {
        return `
          <div style="display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; font-size: 12px;">
            <span style="font-weight: 700; white-space: nowrap; min-width: 130px; font-size: 11px;">${lbl}:</span>
            <span style="border-bottom: 1px solid #000; flex: 1; font-weight: 700; padding-bottom: 1px; text-align: center;">
              ${val || "___________"}
            </span>
          </div>
        `;
      }

      return `
        <div dir="rtl" style="width: 210mm; height: 297mm; margin: 0 auto; padding: 10mm 12mm; background: white; color: #000; line-height: 1.55; overflow: hidden; box-sizing: border-box;">
          <div style="border: 3px solid #000; height: 100%; padding: 8px 12px; display: flex; flex-direction: column; box-sizing: border-box;">
            <div style="border: 1px solid #000; flex: 1; padding: 6px 10px; display: flex; flex-direction: column; box-sizing: border-box;">
              
              <!-- Header -->
              <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px;">
                <div>
                  <div style="font-size: 15px; font-weight: 900;">مؤسسة أجرة لتقنية المعلومات</div>
                  <div style="font-size: 10px; color: #444;">إدارة أسطول المركبات — المملكة العربية السعودية</div>
                </div>
                <div style="border: 2px solid #000; padding: 3px 14px; font-size: 16px; font-weight: 900; letter-spacing: 2px;">سند تسليم مركبة</div>
              </div>

              <!-- Meta -->
              <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px;">
                <div><b>رقم السند: </b><span style="border-bottom: 1px solid #000; min-width: 90px; display: inline-block; text-align: center; padding-bottom: 1px;">${vNum}</span></div>
                <div><b>تاريخ التسليم: </b><span style="border-bottom: 1px solid #000; min-width: 90px; display: inline-block; text-align: center; padding-bottom: 1px;">${date}</span></div>
              </div>

              <!-- Side by Side Details Grid -->
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                <div style="border: 1px solid #000; padding: 5px 8px;">
                  <div style="font-weight: 900; font-size: 11px; border-bottom: 1px solid #000; margin-bottom: 6px; padding-bottom: 2px;">بيانات السائق المستلم</div>
                  ${getFR("اسم السائق", v.driver_name)}
                  ${getFR("رقم الهوية / الإقامة", v.driver_national_id)}
                  ${getFR("رقم الجوال", v.driver_phone)}
                  ${getFR("تاريخ الاستلام", date)}
                </div>
                <div style="border: 1px solid #000; padding: 5px 8px;">
                  <div style="font-weight: 900; font-size: 11px; border-bottom: 1px solid #000; margin-bottom: 6px; padding-bottom: 2px;">بيانات المركبة المسلَّمة</div>
                  ${getFR("الماركة / الموديل", v.car_company && v.car_model ? `${v.car_company} ${v.car_model}` : "")}
                  ${getFR("سنة الصنع", v.car_year ? String(v.car_year) : "")}
                  ${getFR("اللون", v.car_color)}
                  ${getFR("رقم اللوحة", v.plate_number)}
                </div>
              </div>

              <!-- Contract Terms -->
              <div style="border: 1px solid #000; padding: 5px 8px; margin-bottom: 8px;">
                <div style="font-weight: 900; font-size: 11px; border-bottom: 1px solid #000; margin-bottom: 6px; padding-bottom: 2px;">شروط العقد والالتزامات</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin-bottom: 6px;">
                  ${getFR("الإيجار الأسبوعي", contract.weekly_required ? `${contract.weekly_required} ريال سعودي` : "")}
                  ${getFR("تاريخ بداية العقد", contract.start_date)}
                </div>
                <div style="font-size: 11px; line-height: 1.75;">
                  <div style="display: flex; gap: 5px; margin-bottom: 2px;"><span>•</span><span>يلتزم السائق بسداد الإيجار الأسبوعي في موعده المحدد دون تأخير.</span></div>
                  <div style="display: flex; gap: 5px; margin-bottom: 2px;"><span>•</span><span>يتحمل السائق مسؤولية أي مخالفات مرورية تصدر بحق المركبة خلال فترة استلامه لها.</span></div>
                  <div style="display: flex; gap: 5px; margin-bottom: 2px;"><span>•</span><span>يلتزم السائق بالمحافظة على المركبة وإعادتها في حالتها الأصلية عند انتهاء العقد.</span></div>
                  <div style="display: flex; gap: 5px; margin-bottom: 2px;"><span>•</span><span>في حال تعرّض المركبة لحادث أو عطل، يُخطر السائق المؤسسة فوراً.</span></div>
                </div>
              </div>

              <!-- Signatures -->
              <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 8px;">
                <div style="flex: 1; text-align: center;">
                  <div style="font-weight: 700; font-size: 11px;">توقيع السائق المستلم</div>
                  <div style="border-bottom: 1px solid #000; margin-top: 32px; margin-bottom: 3px;"></div>
                  <div style="font-size: 10px; color: #666;">التوقيع والختم</div>
                </div>
                <div style="flex: 1; text-align: center;">
                  <div style="font-weight: 700; font-size: 11px;">ممثل المؤسسة / المسلِّم</div>
                  <div style="border-bottom: 1px solid #000; margin-top: 32px; margin-bottom: 3px;"></div>
                  <div style="font-size: 10px; color: #666;">التوقيع والختم</div>
                </div>
              </div>

              <!-- Footer -->
              <div style="border-top: 1px solid #ccc; margin-top: 6px; padding-top: 4px; display: flex; justify-content: space-between; font-size: 10px; color: #666;">
                <span>هذه الوثيقة صادرة إلكترونياً ومعتمدة من المؤسسة</span>
                <span>رقم الوثيقة: ${vNum} | أجرة © ${new Date().getFullYear()}</span>
              </div>

            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
